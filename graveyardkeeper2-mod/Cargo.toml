[package]
name = "graveyardkeeper2-mod"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# Graveyard Keeper 2 (Unity 6000.3.9f1 Mono) mod. Rust cdylib
# loaded into the game by the Unityforge.Shim BepInEx plugin.
# Minimal scaffold: HTTP control plane for live research and
# nothing else until a research test asks for more.

[lib]
crate-type = ["cdylib"]
name = "graveyardkeeper2_mod"

[dependencies]
modforge = { path = "../modforge" }
unityforge = { path = "../unityforge" }
serde_json = { workspace = true }
parking_lot = { workspace = true }

[dev-dependencies]
serde = { workspace = true }

[lints]
workspace = true

[package.metadata.unityforge]
deploy_name = "graveyardkeeper2_mod.unityforge.dll"
