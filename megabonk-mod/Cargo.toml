[package]
name = "megabonk-mod"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# Megabonk mod. Rust cdylib loaded into the IL2CPP game (Unity
# 2023.2.22f1) by Unityforge.Shim.Melon (MelonLoader entry), the
# same path schedule1-mod runs on. v1 scope is the HTTP control
# plane for live research.

[lib]
crate-type = ["cdylib"]
name = "megabonk_mod"

[dependencies]
modforge = { path = "../modforge" }
unityforge = { path = "../unityforge" }
serde_json = { workspace = true }
parking_lot = { workspace = true }

# Deploy convention: the MelonLoader shim looks for exactly ONE
# `*.unityforge.dll` in the game's Mods folder. scripts/restart.ps1
# copies the cdylib there as `megabonk_mod.unityforge.dll`.

[lints]
workspace = true

[package.metadata.unityforge]
deploy_name = "megabonk_mod.unityforge.dll"
