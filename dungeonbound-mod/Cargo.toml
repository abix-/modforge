[package]
name = "dungeonbound-mod"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# Dungeonbound mod. Godot 4.7.1 (custom build, encrypted pack).
# The game already loads the GodotSteam GDExtension; this DLL takes
# its file name and starts the real one through godotforge's godot4
# stand-in. godot is a direct dependency because godot-rust's entry
# macro names it.

[lib]
name = "dungeonbound_mod"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "dungeonbound-deploy"
path = "src/bin/deploy.rs"

[dependencies]
anyhow = { workspace = true }
fastrand = { workspace = true }
modforge = { path = "../modforge" }
# Features come from godotforge's godot4.
godot = "0.5.5"
godotforge = { path = "../godotforge", features = ["godot4"] }

[dev-dependencies]
serde_json = { workspace = true }

[lints]
workspace = true
