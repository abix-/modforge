# poe2-mod settings. Edit while poe2-mod runs: the file is read again
# when it changes, no rebuild or restart. A field left out takes its
# default. If the file does not parse, the last good one stays and the
# error shows in the pickup and attack ops.
#
# Distances are grid cells from the player; 1920x1080 is about 211 by
# 119 cells (research_screen_cells). Waits are milliseconds, drawn
# evenly from min to max.

attack:
  # Chaos Bolt reaches the whole screen; the middle to a corner is
  # about 120 cells, and enemies off the screen are never taken.
  range: 120
  pause: {min: 300, max: 700}
  # How far from the body's middle a click may land: half width, half
  # height, pixels.
  spread: [10, 15]
  # Only enemies with no wall between: every cell on the line from you
  # has terrain targeting above 0 (the grid ExileCore2 calls terrain
  # targeting). Set false if it skips enemies you can hit.
  line_of_sight: true
  timing:
    react: {min: 5, max: 80}
    step: {min: 1, max: 4}
    settle: {min: 20, max: 70}
    hold: {min: 30, max: 90}

pickup:
  range: 120
  pause: {min: 120, max: 260}
  # Before the same item is clicked again.
  same_item_ms: 600
  # Clicks on one item before it is left alone.
  tries: 3
  # How far in from the label's edges a click lands, pixels.
  margin: [5, 3]
  timing:
    react: {min: 5, max: 150}
    step: {min: 1, max: 4}
    settle: {min: 20, max: 70}
    hold: {min: 30, max: 90}

roll:
  # A live enemy this many cells away or nearer sets off a roll away
  # from all of them. A first guess: tune it to where monsters start
  # to hit.
  danger: 15
  pause: {min: 900, max: 1400}
  # The game's dodge roll key, and the move keys (WASD movement): the
  # roll holds the ones pointing away, lifts the others for a moment
  # if you hold them, and gives them back.
  key: space
  up: w
  left: a
  down: s
  right: d
  timing:
    react: {min: 5, max: 40}
    # After the roll key is let go, before the move keys are.
    step: {min: 30, max: 60}
    # Move keys down before the roll key.
    settle: {min: 15, max: 35}
    # The roll key held.
    hold: {min: 30, max: 70}

# Items pickup takes. An item passes a rule when every condition given
# holds; the first rule it passes names the click. Conditions:
#   names: [..]          the name or base contains one of these
#   path_contains: ".."  the metadata path contains this
#   rarity: [Normal, Magic, Rare, Unique]
#   min_exalted: 5       the stack is worth at least this (poe.ninja)
#   mods: [..]           every one appears in some mod's text
# Text matches ignore case.
rules:
  - name: currency
    path_contains: Metadata/Items/Currency
  - name: scrolls
    names: [Scroll of Wisdom]
  - name: waystones
    path_contains: Metadata/Items/Waystones
  - name: uniques 5 ex
    rarity: [Unique]
    min_exalted: 5

# Pickup opens every closed chest, any kind (anything with a Chest
# part: chests, lockers, eggs, urns): by its label when it has one
# (ExileCore2 PickIt), else by a click on it, the nearest first.
chests:
  open: true
