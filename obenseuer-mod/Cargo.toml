[package]
name = "obenseuer-mod"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# Obenseuer (Unity 2019.4 Mono) mod. Rust cdylib loaded into the
# game by the Unityforge.Shim BepInEx plugin. Research and findings
# live in docs/research.md; todo in docs/todo.md.

[lib]
crate-type = ["cdylib"]
name = "obenseuer_mod"

[dependencies]
modforge = { path = "../modforge" }
unityforge = { path = "../unityforge" }
serde = { workspace = true }
serde_json = { workspace = true }
parking_lot = { workspace = true }
anyhow = { workspace = true }

[lints]
workspace = true

[package.metadata.unityforge]
deploy_name = "obenseuer_mod.unityforge.dll"
