[package]
name = "contrabandpolice-mod"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# Contraband Police mod. Rust cdylib loaded into the IL2CPP game
# (Unity 2022.3.62f2) by Unityforge.Shim.Melon (MelonLoader entry),
# the same path mechabellum-mod, megabonk-mod and schedule1-mod run
# on. v1 scope is the HTTP control plane for live research.

[lib]
crate-type = ["cdylib"]
name = "contrabandpolice_mod"

[dependencies]
modforge = { path = "../modforge" }
unityforge = { path = "../unityforge" }
serde_json = { workspace = true }

# Deploy convention: the MelonLoader shim looks for exactly ONE
# `*.unityforge.dll` in the game's Mods folder. scripts/restart.ps1
# copies the cdylib there as `contrabandpolice_mod.unityforge.dll`.

[lints]
workspace = true

[package.metadata.unityforge]
deploy_name = "contrabandpolice_mod.unityforge.dll"
