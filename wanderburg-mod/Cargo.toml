[package]
name = "wanderburg-mod"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# Wanderburg mod. Rust cdylib loaded into the IL2CPP game (Unity
# 6000.0.63f1) by Unityforge.Shim.Melon, the MelonLoader entry.
# Minimal on purpose: the HTTP control plane for live research and
# nothing else until a research test asks for more.

[lib]
crate-type = ["cdylib"]
name = "wanderburg_mod"

[dependencies]
modforge = { path = "../modforge" }
unityforge = { path = "../unityforge" }
serde_json = { workspace = true }
parking_lot = { workspace = true }

[dev-dependencies]
serde = { workspace = true }

# Deploy convention: the MelonLoader shim looks for exactly ONE
# `*.unityforge.dll` in the game's Mods folder. After building,
# copy the cdylib there as `wanderburg_mod.unityforge.dll`.

[lints]
workspace = true

[package.metadata.unityforge]
deploy_name = "wanderburg_mod.unityforge.dll"
