[package]
name = "pureskill-mod"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# Pure Skill (demo, Steam app 5503090) mod. Rust cdylib loaded into
# the IL2CPP game (Unity 6000.3.13f1, metadata v39) by
# Unityforge.Shim.Il2Cpp, the BepInEx 6 entry. MelonLoader 0.7.3
# crashes this build while generating interop assemblies. Control
# plane only until a research test asks for more.

[lib]
crate-type = ["cdylib"]
name = "pureskill_mod"

[dependencies]
modforge = { path = "../modforge" }
unityforge = { path = "../unityforge" }

[dev-dependencies]
serde_json = { workspace = true }

# Deploy convention: the shim looks for exactly ONE
# `*.unityforge.dll` next to itself in BepInEx/plugins/unityforge/. scripts/restart.ps1
# copies the cdylib there as `pureskill_mod.unityforge.dll`.

[lints]
workspace = true

[package.metadata.unityforge]
deploy_name = "pureskill_mod.unityforge.dll"
