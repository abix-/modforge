# The one test runner for the workspace (cargo-nextest):
# `k3sc cargo-lock nextest run -p <crate>`. Every test runs in its own
# process, prints its time, and keeps its output in
# target/nextest/default/junit.xml whether it passed or failed.

[store]
dir = "target/nextest"

[profile.default]
# Every test's result and time as it finishes; the summary repeats
# only the slow and the failed.
status-level = "all"
final-status-level = "slow"
failure-output = "immediate-final"
success-output = "never"
# A test past 30 s is reported slow each 30 s, and stopped at 2 min.
slow-timeout = { period = "30s", terminate-after = 4 }

[profile.default.junit]
path = "junit.xml"
store-success-output = true
store-failure-output = true
