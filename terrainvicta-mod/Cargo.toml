[package]
name = "terrainvicta-mod"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# Terra Invicta mod. Unity 2020.3.49f1 Mono game by Pavonis Interactive
# (AppID 1176470). Rust cdylib loaded by cs-shim-mono (BepInEx 5)
# through unityforge. Research lives in docs/research.md; todo in
# docs/todo.md.

[lib]
crate-type = ["cdylib"]
name = "terrainvicta_mod"

[dependencies]
modforge = { path = "../modforge" }
unityforge = { path = "../unityforge" }
serde_json = { workspace = true }

[dev-dependencies]
modforge = { path = "../modforge" }
unityforge = { path = "../unityforge" }
serde_json = { workspace = true }

[lints]
workspace = true

[package.metadata.unityforge]
deploy_name = "terrainvicta_mod.unityforge.dll"
