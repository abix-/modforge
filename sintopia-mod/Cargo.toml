[package]
name = "sintopia-mod"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# Sintopia mod. Rust cdylib loaded into the game by UE4SS as a
# CPPMod via the stock ueforge shim.

[lib]
crate-type = ["cdylib", "rlib"]
name = "sintopia_mod"

[package.metadata.ueforge]
mod_folder_name  = "SintopiaMod"
game_name_regex  = "Sintopia"
game_sub_path    = "Sintopia/Binaries/Win64"
zip_prefix       = "sintopia-mod"
target_dir       = "target/sintopia-mod"

[features]
console = []
default = ["console"]

[dependencies]
anyhow = { workspace = true }
widestring = { workspace = true }
memoffset = { workspace = true }
parking_lot = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
ueforge = { path = "../ueforge" }
modforge = { path = "../modforge" }
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Console",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_Storage_FileSystem",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_ProcessStatus",
    "Win32_System_Diagnostics_ToolHelp",
] }

[build-dependencies]
ueforge = { path = "../ueforge" }

[dev-dependencies]
ueforge = { path = "../ueforge" }
hex = { workspace = true }
zerocopy = { workspace = true }

[lints]
workspace = true
