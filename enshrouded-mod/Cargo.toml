[package]
name = "enshrouded-mod"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# Enshrouded mod. Keen Games' own engine, native PE, no anti-cheat
# loaded. modforge-inject loads enshrouded.dll into the running
# enshrouded.exe, where it serves the modforge control plane on
# 127.0.0.1:33080 with every op in modforge::process_ops.
[lib]
name = "enshrouded"
crate-type = ["cdylib", "rlib"]

[dependencies]
modforge = { path = "../modforge" }
serde_json = { workspace = true }
windows-sys = { workspace = true, features = ["Win32_Foundation"] }

[lints]
workspace = true
